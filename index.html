<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>唐瑞遥 Candice · 个人主页</title>
  <meta name="description" content="唐瑞遥 Candice 的个人主页 —— 同济大学供应链管理研究生。" />
  <!-- Google Fonts（正文/标题依据 docs/00 §3；Permanent Marker + Caveat Brush 为粉笔刷欢迎语）-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body class="page-home">

  <!-- ===== 背景三层（海在底，位移最小） ===== -->
  <div class="hero-bg" data-depth="0.04"><img src="assets/hero_sea.png" alt="" /></div>
  <div class="hero-shimmer" aria-hidden="true"></div>
  <div class="hero-veil" aria-hidden="true"></div>

  <!-- 飘落的星星（JS 生成） -->
  <div class="stars" aria-hidden="true"></div>

  <!-- ===== 语言切换 ===== -->
  <button class="lang-toggle glass" onclick="toggleLang()" aria-label="切换语言 / Switch language">
    <span lang="zh">EN</span><span lang="en">中</span>
  </button>

  <main class="hero">

    <!-- 顶部欢迎语：粉笔刷 · 立体 · 逐字书写 · 写完画出小太阳 -->
    <div class="welcome">
      <span class="welcome-line">Welcome~</span>
      <!-- 手绘小太阳：写完后一笔笔画出来再抖动 -->
      <svg class="welcome-sun" viewBox="0 0 100 100" width="92" height="92" aria-hidden="true">
        <g class="sun-ink" fill="none" stroke="#ffce3a" stroke-width="4.5" stroke-linecap="round">
          <line class="stroke" x1="50" y1="5"  x2="50" y2="19" />
          <line class="stroke" x1="50" y1="81" x2="50" y2="95" />
          <line class="stroke" x1="5"  y1="50" x2="19" y2="50" />
          <line class="stroke" x1="81" y1="50" x2="95" y2="50" />
          <line class="stroke" x1="17" y1="17" x2="27" y2="27" />
          <line class="stroke" x1="73" y1="73" x2="83" y2="83" />
          <line class="stroke" x1="83" y1="17" x2="73" y2="27" />
          <line class="stroke" x1="27" y1="73" x2="17" y2="83" />
          <circle class="stroke" cx="50" cy="50" r="22" />
        </g>
        <g class="sun-face">
          <circle cx="43" cy="47" r="2.6" fill="#ffce3a" />
          <circle cx="57" cy="47" r="2.6" fill="#ffce3a" />
          <path d="M42 55 q8 7 16 0" fill="none" stroke="#ffce3a" stroke-width="3.4" stroke-linecap="round" />
        </g>
      </svg>
    </div>

    <!-- 人像（右移 · 中景 · 跟手浮动） -->
    <figure class="person" data-depth="0.10">
      <img src="assets/person.png" alt="唐瑞遥 Candice" />
      <span class="person-halo" aria-hidden="true"></span>
    </figure>

    <!-- 右侧整列：名片 → 〔引导语 + 两颗气泡〕两栏 -->
    <div class="right-col">

      <!-- 名片（横向 · 暗青玻璃 · 白字 · 朝光标 3D 转身） -->
      <section class="card glass" id="card" data-depth="0.18">
        <span class="card-shine" aria-hidden="true"></span>

        <div class="avatar">
          <!-- 有头像图时换成 <img src="assets/avatar.jpg" alt="头像"> -->
          <span class="avatar-letter">唐</span>
        </div>

        <div class="card-body">
          <h1 class="name t-h1">
            <span lang="zh">唐瑞遥</span><span lang="en">Candice</span>
          </h1>
          <p class="title">
            <span lang="zh">同济大学 · 供应链管理</span>
            <span lang="en">Supply Chain Management · Tongji</span>
          </p>
          <ul class="meta">
            <li>✉ <a href="mailto:try_candice@163.com">try_candice@163.com</a></li>
            <li>📍 <span lang="zh">上海</span><span lang="en">Shanghai</span></li>
          </ul>
          <nav class="socials" aria-label="社交链接">
            <a class="social" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.22.79 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
            </a>
            <span class="social social-wechat" tabindex="0" role="button" aria-label="微信">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8.69 4C4.62 4 1.33 6.79 1.33 10.23c0 1.94 1.05 3.67 2.7 4.82l-.67 2.04 2.37-1.2c.85.24 1.74.4 2.66.43a4.9 4.9 0 0 1-.16-1.34c0-3.02 2.93-5.45 6.55-5.45.24 0 .47.02.7.04C14.93 6.2 12.1 4 8.69 4zM6.3 8.7a.92.92 0 1 1 0-1.85.92.92 0 0 1 0 1.85zm4.78 0a.92.92 0 1 1 0-1.85.92.92 0 0 1 0 1.85zm11.59 6.06c0-2.87-2.83-5.2-6.16-5.2-3.48 0-6.16 2.4-6.16 5.2s2.68 5.2 6.16 5.2c.71 0 1.43-.13 2.12-.36l1.95 1.02-.55-1.68c1.42-.97 2.64-2.32 2.64-4.18zm-8.13-.83a.77.77 0 1 1 0-1.54.77.77 0 0 1 0 1.54zm3.93 0a.77.77 0 1 1 0-1.54.77.77 0 0 1 0 1.54z"/></svg>
              <span class="qr glass" role="dialog" aria-label="微信二维码">
                <img src="assets/wechat-qr.jpg" alt="微信二维码" />
                <em><span lang="zh">扫码加我</span><span lang="en">Scan to add</span></em>
              </span>
            </span>
          </nav>
        </div>
      </section>

      <!-- 引导语(左) + 两颗气泡(右)：两栏 -->
      <div class="enter-row">
        <p class="enter-hint">
          <span lang="zh">选一个<br>方向<br>戳破进入<br>✦</span>
          <span lang="en">Pick a<br>side<br>pop to<br>enter ✦</span>
        </p>
        <nav class="portals" aria-label="进入">
          <a class="bubble bubble-work" href="work.html" aria-label="进入工作页">
            <span class="bubble-label"><span lang="zh">工作 · 学术</span><span lang="en">Work · Academia</span></span>
          </a>
          <a class="bubble bubble-life" href="life.html" aria-label="进入生活页">
            <span class="bubble-label"><span lang="zh">生活 · 思考</span><span lang="en">Life · Thoughts</span></span>
          </a>
        </nav>
      </div>

    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
